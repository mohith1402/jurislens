name: CI - Code Quality, Security & Automated Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Max line length 140 for legal tech strings
          flake8 app tests --count --exit-zero --max-line-length=140 --statistics

      - name: Run Automated Pytest Suite
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: ""
        run: |
          pytest -v --durations=10
